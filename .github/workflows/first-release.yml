name: Publish Veilbound v1.0.0

on:
  push:
    branches: [main]
    paths: [docs/releases/v1.0.0.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the first release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          grep -Fx 'config/version="1.0.0"' project.godot
          if gh release view v1.0.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.0 --target "$RELEASE_COMMIT" --title "Veilbound v1.0.0" --notes-file docs/releases/v1.0.0.md --latest
